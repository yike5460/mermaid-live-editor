<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, minimum-scale=1, shrink-to-fit=no" />
  <title>Mermaid Guru - Online Diagram Editor</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png">

  <!-- Base Meta tags -->
  <link rel="canonical" href="https://mermaid.guru" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mermaid.guru" />
  <meta property="og:image" content="%sveltekit.assets%/favicon.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://mermaid.guru" />
  <meta name="twitter:image" content="%sveltekit.assets%/favicon.png" />

  <!-- PWA support -->
  <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />

  %sveltekit.head%
</head>

<body style="overflow: hidden">
  <div id="svelte">%sveltekit.body%</div>
</body>

</html>
